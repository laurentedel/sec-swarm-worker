[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sec-swarm-worker"
version = "0.1.0"
description = "Multi-agent CVE triage swarm (find / prove / patch) as a Mistral Studio Workflow"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows>=2.0.0",
    "mistralai-workflows-plugins-mistralai",
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["sec_swarm"]
